# Explainable AI for Healthcare Diagnosis — full stack.
#
#   docker compose up --build
#
# API on http://localhost:8000 (OpenAPI docs at /docs), dashboard on
# http://localhost:3000.
#
# The API build context is the repository root, not api/, because the image needs
# the shared `xai` package and the notebook artefacts in models/ and results/.
# Run the notebooks before building: the API refuses to start without them,
# loudly, rather than serving fabricated numbers.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: xai-healthcare-api:1.0.0
    container_name: xai-api
    env_file:
      - ./api/.env
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
      interval: 15s
      timeout: 5s
      retries: 5
      # Twelve models, twelve SHAP explainers and four LIME explainers take a
      # while to load; a short start period would kill the container mid-startup.
      start_period: 120s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Browser-facing origin, baked into the client bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        # Container-to-container origin, used while prerendering.
        API_INTERNAL_URL: http://api:8000
    image: xai-healthcare-web:1.0.0
    container_name: xai-web
    env_file:
      - ./web/.env
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
